name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Setup native dependencies
        run: node scripts/setup-native-deps.mjs

      - name: Verify native artifacts
        run: |
          test -f artifacts/suproxy/modules/suproxy-vpn/android/libs/libv2ray.aar
          test -f artifacts/suproxy/modules/suproxy-vpn/android/maven/com/github/2dust/libv2ray/26.6.14/libv2ray-26.6.14.aar
          test -f artifacts/suproxy/modules/suproxy-vpn/android/src/main/jni/hev-socks5-tunnel/Android.mk

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (Android)
        working-directory: artifacts/suproxy
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Patch Android Gradle
        run: node scripts/patch-android-gradle.mjs

      - name: Configure release build
        working-directory: artifacts/suproxy/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: artifacts/suproxy/android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: artifacts/suproxy/gradle-build.log

      - name: Report Gradle failures
        if: failure()
        working-directory: artifacts/suproxy
        run: |
          if [ -f gradle-build.log ]; then
            echo "## Gradle failure excerpt" >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILED|error:|Error:|Exception|Could not|e: file:" gradle-build.log | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            grep -E "FAILED|error:|Error:|Exception|Could not|e: file:" gradle-build.log | tail -n 15 | while IFS= read -r line; do
              echo "::error title=Gradle::${line}"
            done || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: suproxy-release-apk
          path: artifacts/suproxy/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
